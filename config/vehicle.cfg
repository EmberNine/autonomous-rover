# Vehicle configuration for the rover.
#
# Values are unmeasured placeholders unless marked (MEASURED).
# Figures are for an Axial SCX24 Jeep Wrangler JLU (1/24 scale).
# See docs/calibration.md for measurement methods.
#
# Units: meters, radians, kilograms. Format: `key = value`. '#' starts a comment.

name = Axial SCX24 Jeep Wrangler JLU

# Front axle center to rear axle center. Caliper, front-edge-to-front-edge
# of tires (MEASURED, 2026-09-22).
wheelbase_meters = 0.133

# Center of left tire to center of right tire, front axle. Caliper,
# outside-to-outside (100 mm) minus one tire width (17 mm) (MEASURED,
# 2026-09-22). The front and rear tracks are genuinely different (the
# front axle is wider) - see rear_track_width_meters below.
front_track_width_meters = 0.083

# Center of left tire to center of right tire, rear axle. Caliper,
# outside-to-outside (98 mm) minus one tire width (17 mm) (MEASURED,
# 2026-09-22). Turning-circle cross-check (0.078-0.079 m) agrees with
# this, not the front value, confirming the rear axle is narrower.
rear_track_width_meters = 0.081

# Rear axle locked: both rear wheels on one shaft, no differential (CONFIRMED
# 2026-10-25: turning one rear wheel by hand turns the other the same way).
# The encoder wheel (rear left) then reads the rear-axle centre's speed in a
# turn, not the inner wheel's; the EKF uses it as is. false: open
# differential, the EKF corrects v_left by yaw_rate * rear_track / 2.
# The front axle is locked too (CONFIRMED by hand 2026-10-25): one motor, a
# locked centre and both axles locked, so all four wheels turn at one speed.
# In tight turns the front runs a larger radius than the rear, the wheels
# fight and scrub, and the encoder over-reads the rear-axle centre's ground
# speed by a few % (consistent with the ~4 % seen in the 2026-10-25 half
# circle). Not modelled: the EKF has no front-axle term.
rear_axle_locked = true

# Outer diameter of the tire, unloaded (MEASURED, 2026-09-22).
tire_diameter_meters = 0.054

# (MEASURED 2026-09-29) AS5600 on left rear wheel, 4096 counts/rev.
# Floor runs over 1.000 m, rear wheel lined up at both lines, gentle throttle:
#   run 2 = 25430 counts, run 3 = 25414 counts (0.06% apart) -> avg 25422 counts/m.
# Calculated from unloaded tire diameter: pi * 0.054 / 4096 = 4.1417e-5 (5.3% too large);
# effective rolling diameter under load = 51.3 mm (soft tire squash).
# Re-check after electronics are installed (more weight -> more squash).
meters_per_encoder_tick = 3.9336e-5

# EFFECTIVE steering limit at full lock, one side: the bicycle-model angle
# that reproduces the real turning circle, delta = atan(L / R_rear).
# (MEASURED 2026-10-22) at the calibrated servo limits (1200 / 1500 / 1800 us),
# full lock "s 100" / "s -100", v 2000 cps, binary motor console, hard floor.
# Turning circles: the truck starts perpendicular to a tape line with both
# rear tires on it and drives a half circle; both rear tire positions marked
# at start and end. Outer-to-outer = 2R + rear track, inner-to-inner =
# 2R - rear track; their average is 2R at the rear-axle centre. Outer - inner
# came out 0.159-0.162 m on every run (0.162 expected from the rear track).
#   left  0.212, 0.197, 0.202 rad (mean 0.204)
#   right 0.216, 0.185, 0.221 rad (mean 0.207)
#   all six: mean 0.206, range 0.185-0.221
# The smaller side mean is used so any commanded turn is achievable in both
# directions. Much smaller than the geometric wheel angle because the locked
# axles scrub in turns. Only full lock was measured: the bridge treats
# percent -> angle as linear (docs/ros-bridge.md).
# Replaces 0.246 (2026-09-22, the stock radio's endpoints, stale).
max_steering_angle_radians = 0.204

# Weight distribution check (MEASURED, 2026-09-22): front axle carries
# 161 g of 302 g (53.3%), placing the vehicle center of mass 70.9 mm ahead
# of the rear axle. After subtracting the measured wheel and knuckle masses,
# the chassis center of mass is 65.9 mm, within 0.6 mm (below scale
# resolution) of the model's midpoint assumption, so no offset is modeled.

# Total vehicle mass with battery installed, kitchen scale (MEASURED, 2026-09-22).
vehicle_mass_kilograms = 0.302

# Mass of one front wheel/tire assembly, kitchen scale (MEASURED, 2026-09-22).
# Heavier than the rear wheels: the front wheels carry aftermarket weights.
front_wheel_mass_kilograms = 0.020

# Mass of one rear wheel/tire assembly, kitchen scale (MEASURED, 2026-09-22).
rear_wheel_mass_kilograms = 0.011
